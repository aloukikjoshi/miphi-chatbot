services:

  vllm:

    build:
      context: .
      dockerfile: Dockerfile.vllm

    container_name: miphi-vllm

    command: >
      --model meta-llama/Llama-3.2-1B-Instruct
      --dtype half
      --max-model-len 4096
      --gpu-memory-utilization 0.75
      --enforce-eager

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}

    ports:
      - "8000:8000"

    ipc: host

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  chatbot:

    build:
      context: .
      dockerfile: Dockerfile.chatbot

    container_name: miphi-chatbot

    depends_on:
      - vllm

    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=meta-llama/Llama-3.2-1B-Instruct

    ports:
      - "8501:8501"

    volumes:
      - .:/app

volumes:
  huggingface-cache: