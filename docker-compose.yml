services:

  postgres:
    image: postgres:16-alpine
    container_name: miphi-postgres
    environment:
      POSTGRES_USER: miphi
      POSTGRES_PASSWORD: miphi_secret
      POSTGRES_DB: miphi_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miphi -d miphi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # vLLM with AWQ 4-bit quantization — fits comfortably in 4GB VRAM
  # Model: hugging-quants/Meta-Llama-3.2-1B-Instruct-AWQ-INT4 (~700MB on GPU vs 2.3GB for float16)
  vllm_gpu:
    image: vllm/vllm-openai:latest
    container_name: miphi-vllm-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command:
      - "--model"
      - "${APP_MODEL}"
      - "--quantization"
      - "bitsandbytes"
      - "--load-format"
      - "bitsandbytes"
      - "--dtype"
      - "half"
      - "--max-model-len"
      - "${APP_MAX_MODEL_LEN}"
      - "--gpu-memory-utilization"
      - "${APP_GPU_MEM_UTIL}"
      - "--enforce-eager"
      - "--max-num-seqs"
      - "4"
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - vllm
    restart: unless-stopped

  # CPU fallback — used when no GPU available (very slow, for testing only)
  vllm_cpu:
    profiles: ["cpu"]
    image: aloukikjoshi/vllm-openai-cpu:latest-x86_64
    container_name: miphi-vllm-cpu
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_CPU_KVCACHE_SPACE=${VLLM_CPU_KVCACHE_SPACE}
    command: ["${APP_MODEL}", "--dtype", "bfloat16", "--max-model-len", "1024", "--enforce-eager"]
    ports:
      - "8001:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface-cache:
  postgres-data:
