services:

  chatbot:

    build:
      context: .
      dockerfile: Dockerfile.chatbot

    container_name: miphi-chatbot

    environment:
      - VLLM_BASE_URL=http://host.docker.internal:8000/v1
      - VLLM_MODEL=${APP_MODEL}

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped