<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiPhi AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="chat-page">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon sm">M</div>
        <span class="logo-text">MiPhi<span class="logo-accent"> AI</span></span>
      </div>
      <button class="btn-icon" id="new-chat-btn" title="New chat" onclick="createNewSession()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div class="sessions-list" id="sessions-list">
      <p class="sessions-empty">No conversations yet</p>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <span class="user-name" id="user-name">User</span>
      </div>
      <button class="btn-icon logout-btn" title="Logout" onclick="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>
  <main class="chat-main">
    <div class="chat-topbar">
      <button class="btn-icon sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="session-title" id="session-title">Select or start a conversation</span>
      <div id="model-status" class="model-badge offline">⬤ Checking...</div>
    </div>
    <div class="messages-area" id="messages-area">
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-icon">M</div>
        <h2>MiPhi AI Assistant</h2>
        <p>Ask me anything about MiPhi products, storage, embedded systems, or semiconductor technology.</p>
        <div class="welcome-chips">
          <button class="chip" onclick="sendQuickMessage(this)">Tell me about MiPhi B100</button>
          <button class="chip" onclick="sendQuickMessage(this)">What are enterprise SSD options?</button>
          <button class="chip" onclick="sendQuickMessage(this)">Explain NAND flash technology</button>
        </div>
      </div>
    </div>
    <div class="input-area" id="input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" class="chat-input" placeholder="Ask anything..." rows="1"
          onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for newline</p>
    </div>
  </main>
  <script src="/js/chat.js"></script>
</body>
</html>
